<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hesap Makinesi</title>
  </head>
  <body>
    <script>
      const add = (a, b) => a + b;
      const subtract = (a, b) => a - b;
      const multiply = (a, b) => a * b;

      const divide = (a, b) => {
        if (b === 0) return "Hata: Sıfıra bölünemez!";
        return a / b;
      };

      const operations = {
        "+": add,
        "-": subtract,
        "*": multiply,
        "/": divide,
      };

      function calculate(num1, num2, operator) {
        if (typeof num1 !== "number" || typeof num2 !== "number") {
          return "Hata: Girdiğiniz değerler sayı (number) formatında olmalıdır.";
        }

        const selectedOperation = operations[operator];

        if (!selectedOperation) {
          return `Hata: '${operator}' geçerli bir işlem türü değil.`;
        }

        return selectedOperation(num1, num2);
      }

      console.log("--- Başarılı İşlemler ---");
      console.log(calculate(15, 5, "+")); 
      console.log(calculate(10, 3, "*")); 
      console.log(calculate(20, 4, "/")); 

      console.log("\n--- Hata (Validation) Kontrolleri ---");
      console.log(calculate(10, 0, "/")); 
      console.log(calculate(10, 5, "^")); 
      console.log(calculate("Sümeyye", 5, "+")); 
    </script>
  </body>
</html>
